# 사내 HTTP 프록시 시나리오: 앱은 외부로 직접 나가지 못하고, 프록시(사설 CA 로 TLS 를 여는 검사형)만 "인터넷"(ext)에 닿는다.
name: hl-e2e-proxy
services:
  ext:
    image: harborline-tools:e2e
    command: ["ext", "--listen", ":8080"]
    networks:
      outside: { aliases: [ext] }
  proxy:
    image: harborline-tools:e2e
    command: ["proxy", "--listen", ":3128", "--ca-cert", "/pca/proxy-ca.pem", "--ca-key", "/pca/proxy-ca.key", "--upstream", "ext:8080"]
    volumes: ["${HL_PROXY_CA}:/pca:ro"]
    networks:
      site: { aliases: [proxy.corp.test] }
      outside: {}
networks:
  site:
    name: hl-e2e-site
    external: true
  outside:
    name: hl-e2e-outside
    internal: true
