# 통합 테스트용 의존 서버. 호스트 포트는 다른 프로젝트와 겹치지 않게 56433·53890·58480 만 쓴다.
name: hl-test-infra
services:
  pg:
    image: postgres:16-alpine
    environment: { POSTGRES_PASSWORD: test, POSTGRES_DB: postgres }
    ports: ["127.0.0.1:56433:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"], interval: 2s, timeout: 3s, retries: 30 }
  ldap:
    image: osixia/openldap:1.5.0
    command: --copy-service
    environment:
      LDAP_ORGANISATION: Harborline Test
      LDAP_DOMAIN: harborline.test
      LDAP_ADMIN_PASSWORD: adminpw
      LDAP_TLS: "false"
    volumes: ["./ldap-users.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/50-users.ldif:ro"]
    ports: ["127.0.0.1:53890:389"]
    healthcheck: { test: ["CMD-SHELL", "ldapsearch -x -H ldap://localhost -b dc=harborline,dc=test -D cn=admin,dc=harborline,dc=test -w adminpw cn=support | grep -q numEntries"], interval: 3s, timeout: 5s, retries: 30 }
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: "8080"
      KC_HEALTH_ENABLED: "true"
    volumes: ["./realm.json:/opt/keycloak/data/import/realm.json:ro"]
    ports: ["127.0.0.1:58480:8080"]
